name: Clojure CI

on: [push]

jobs:
  lint:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          lein: latest

      - name: Lint
        run: lein cljfmt check

  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-java@v6.2.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - uses: DeLaGuardo/setup-clojure@13.7.0
      with:
        cli: latest

    - uses: astral-sh/setup-uv@v10.3.3
      with:
        version: latest-known

    - name: Run tests
      run: clojure -X:test

  install:
    name: Install
    needs:
      - lint
      - test

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest

      - name: Install locally
        run: |
          clojure -T:build jar
          clojure -X:install
  release:
    name: Release
    needs:
      - lint
      - test
    if: ${{ github.ref == 'refs/heads/main'
      || github.ref == 'refs/heads/master' 
      || startsWith(github.ref, 'refs/heads/SNAPSHOT') }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest

      - name: Release to clojars
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_TOKEN }}
        run: |
          clojure -T:build jar
          clojure -X:deploy